# Rekamind backend. Works as a Portainer stack (Stacks -> Add stack -> paste, or
# "Repository" pointing at this repo) and with plain `docker compose up -d`.
#
# AUTH: sign-in is Google only, with YOUR OWN OAuth client (see docs/AUTH.md). The server refuses
# to start without REKAMIND_GOOGLE_CLIENT_ID / _SECRET / REKAMIND_PUBLIC_URL. The port is published on
# loopback; put an HTTPS reverse proxy in front for other machines (public URL must be https).
services:
  rekamind:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: rekamind-server:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REKAMIND_PORT:-8787}:8787"
    environment:
      REKAMIND_AUTH: ${REKAMIND_AUTH:-google}
      REKAMIND_PUBLIC_URL: ${REKAMIND_PUBLIC_URL:?set REKAMIND_PUBLIC_URL, e.g. https://rekamind.example.com}
      REKAMIND_GOOGLE_CLIENT_ID: ${REKAMIND_GOOGLE_CLIENT_ID:?create a Google OAuth client, see docs/AUTH.md}
      REKAMIND_GOOGLE_CLIENT_SECRET: ${REKAMIND_GOOGLE_CLIENT_SECRET:?create a Google OAuth client, see docs/AUTH.md}
      REKAMIND_SUPERADMINS: ${REKAMIND_SUPERADMINS:?set at least one super admin email}
      REKAMIND_SIGNUP: ${REKAMIND_SIGNUP:-allowlist}
      REKAMIND_TIMEZONE: ${REKAMIND_TIMEZONE:-Asia/Jakarta}
      # Origins the desktop app (server mode) calls the API from. Leave the default if you use it; add your own if you serve another web page.
      REKAMIND_CORS_ORIGINS: ${REKAMIND_CORS_ORIGINS:-http://tauri.localhost,https://tauri.localhost,tauri://localhost}
      # Needed to store integration tokens (GitHub/GitLab/webhook secrets): >= 32 random characters.
      REKAMIND_SECRET_KEY: ${REKAMIND_SECRET_KEY:-}
      REKAMIND_INTEGRATIONS_ALLOW_PRIVATE: ${REKAMIND_INTEGRATIONS_ALLOW_PRIVATE:-false}
      REKAMIND_ALLOWED_EMAILS: ${REKAMIND_ALLOWED_EMAILS:-}
      REKAMIND_ALLOWED_DOMAINS: ${REKAMIND_ALLOWED_DOMAINS:-}
      REKAMIND_ENGINES: ${REKAMIND_ENGINES:-none}
      # Leave empty for SQLite in the volume. For a shared server use e.g.
      # postgresql+asyncpg://rekamind:secret@db:5432/rekamind
      REKAMIND_DATABASE_URL: ${REKAMIND_DATABASE_URL:-}
      # Audio storage: local volume by default; any S3-protocol store (MinIO, SeaweedFS, AWS) otherwise.
      REKAMIND_STORAGE: ${REKAMIND_STORAGE:-local}
      REKAMIND_S3_ENDPOINT_URL: ${REKAMIND_S3_ENDPOINT_URL:-}
      REKAMIND_S3_BUCKET: ${REKAMIND_S3_BUCKET:-rekamind}
      REKAMIND_S3_ACCESS_KEY: ${REKAMIND_S3_ACCESS_KEY:-}
      REKAMIND_S3_SECRET_KEY: ${REKAMIND_S3_SECRET_KEY:-}
    volumes:
      - rekamind-data:/data

volumes:
  rekamind-data:
