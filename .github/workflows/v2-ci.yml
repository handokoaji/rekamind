name: v2 CI

on:
  push:
    branches: ["v2/**"]
  pull_request:
    paths: ["server/**", "web/**", "docker-compose.yml", ".github/workflows/v2-ci.yml"]

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: server/pyproject.toml }
      - run: pip install -e "server[dev,postgres]" ruff
      - run: ruff check server
      - run: pytest server -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e "server[dev]"
      - run: npm ci
        working-directory: web
      - run: npx tsc -b --noEmit && npx vitest run && npm run build
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      # Real backend (fake engines) serving the real production build.
      - run: npx playwright test
        working-directory: web
        env: { REKAMIND_PYTHON: python }

  recorder:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: recorder } }
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: recorder }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # On Windows this also exercises the real GetProcessTimes/WASAPI-backend compile (MSVC).
      - run: cargo test --no-fail-fast
      - run: cargo build --release
      # Download this on a real Windows PC and run:  rekamind-rec.exe record --stats
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with: { name: rekamind-rec-windows, path: recorder/target/release/rekamind-rec.exe }

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, bundles: nsis, exe: desktop/src-tauri/resources/backend/rekamind-backend.exe, art: "desktop/src-tauri/target/release/bundle/nsis/*.exe" }
          - { os: ubuntu-latest, bundles: deb, exe: desktop/src-tauri/resources/backend/rekamind-backend, art: "desktop/src-tauri/target/release/bundle/deb/*.deb" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "web/package-lock.json\ndesktop/package-lock.json" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "desktop/src-tauri" }
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libpulse-dev patchelf
      - run: pip install -e "server[dev]" pyinstaller
      # One command: web UI -> frozen backend -> installer that contains it. WebView2 is preinstalled on windows-latest.
      - run: python scripts/build_desktop.py --bundles ${{ matrix.bundles }}
      # The frozen backend is exactly what ships; prove it starts, migrates, refuses strangers and processes a recording.
      - run: python scripts/smoke_backend.py ${{ matrix.exe }}
      - uses: actions/upload-artifact@v4
        with: { name: "rekamind-installer-${{ matrix.os }}", path: "${{ matrix.art }}" }

  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extras: ["postgres,s3", "postgres,s3,asr", "postgres,s3,asr,cuda"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Same three variants the release publishes to GHCR (API only, -cpu, -cuda); built here, never pushed.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          build-args: EXTRAS=${{ matrix.extras }}
          push: false
          load: true
          tags: rekamind-server:ci
      - name: The image starts and answers /api/health
        run: |
          docker run -d --name rk -p 8787:8787 -e REKAMIND_AUTH=none -e REKAMIND_INSECURE_NO_AUTH=true -e REKAMIND_ENGINES=none rekamind-server:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/health && exit 0; sleep 1; done
          docker logs rk; exit 1
      - name: compose from source still builds
        run: docker compose build
        env:
          REKAMIND_PUBLIC_URL: https://rekamind.example.org
          REKAMIND_GOOGLE_CLIENT_ID: ci-placeholder
          REKAMIND_GOOGLE_CLIENT_SECRET: ci-placeholder
          REKAMIND_SUPERADMINS: admin@example.org
