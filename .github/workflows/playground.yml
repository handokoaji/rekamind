name: Playground image

# Manual build of the GPU + diarize server image with the UI served under /playground/rekamind/
# (https://apps.ugm.ac.id/playground/rekamind/, a proxy strips the prefix before the backend).
# Not a release: no tag, no installers, no GitHub release; the normal images are untouched.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Image name
        id: n
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rekamind-server" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          build-args: |
            EXTRAS=postgres,s3,asr,cuda,diarize
            REKAMIND_BASE=/playground/rekamind/
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.n.outputs.repo }}:playground
            ${{ steps.n.outputs.repo }}:playground-${{ github.sha }}
