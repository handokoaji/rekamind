name: Release

# Dipicu tag v*. Tag berakhiran -alpha.N / -beta.N / -rc.N menjadi PRE-RELEASE (bukan "latest").
# Setiap installer dibangun dari kode pada tag, lulus smoke test backend beku, lalu diunggah dengan
# nama tetap + SHA256SUMS.
on:
  push:
    tags: ["v*"]
  # Manual run: builds the HEAD of the branch you pick (use master) and creates the tag if it does not exist yet.
  workflow_dispatch:
    inputs:
      tag: { description: "Tag to release, e.g. v0.4.0-beta.1 (must equal the version in the files; created if missing)", required: true }

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }
      - name: Versi semua berkas sama dengan tag
        run: python scripts/set_version.py --check "${TAG#v}"
      - name: Catatan rilis ada
        run: test -s "docs/release-notes/${TAG}.md"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            exe: desktop/src-tauri/resources/backend/rekamind-backend.exe
            glob: "desktop/src-tauri/target/release/bundle/nsis/*-setup.exe"
            name: Rekamind-Windows-x64-setup.exe
          - os: ubuntu-22.04
            bundles: deb
            exe: desktop/src-tauri/resources/backend/rekamind-backend
            glob: "desktop/src-tauri/target/release/bundle/deb/*.deb"
            name: Rekamind-Linux-x64.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "web/package-lock.json\ndesktop/package-lock.json" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: "desktop/src-tauri" }
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf
      - run: pip install -e "server[dev]" pyinstaller
      - run: python scripts/build_desktop.py --bundles ${{ matrix.bundles }}
      - name: Smoke test backend beku (harus lulus sebelum dirilis)
        run: python scripts/smoke_backend.py ${{ matrix.exe }}
      - name: Beri nama tetap
        shell: bash
        run: |
          mkdir -p out
          f=$(ls ${{ matrix.glob }} | head -n1)
          cp "$f" "out/${{ matrix.name }}"
          ls -la out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: "installer-${{ matrix.os }}", path: "out/*", if-no-files-found: error }

  # AppImage dicoba terpisah: kegagalannya tidak boleh menggagalkan rilis .exe / .deb.
  appimage:
    needs: verify
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "web/package-lock.json\ndesktop/package-lock.json" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.13" }
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with: { workspaces: "desktop/src-tauri" }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf
      - run: pip install -e "server[dev]" pyinstaller
      # linuxdeploy is itself an AppImage and needs FUSE, which hosted runners lack: run it extracted instead.
      - run: python scripts/build_desktop.py --bundles appimage
        env: { APPIMAGE_EXTRACT_AND_RUN: "1", NO_STRIP: "true" }
      - run: python scripts/smoke_backend.py desktop/src-tauri/resources/backend/rekamind-backend
      - run: |
          mkdir -p out
          cp "$(ls desktop/src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)" out/Rekamind-Linux-x64.AppImage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: installer-appimage, path: out/*, if-no-files-found: error }

  publish:
    needs: [build, appimage]
    environment: release          # add required reviewers in Settings -> Environments to gate publishing
    permissions: { contents: write }
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        # only our installers: the docker build-summary artifacts must not be pulled in (their download failed the job)
        with: { path: dl, pattern: "installer-*", merge-multiple: true }
      - name: Checksum
        run: cd dl && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Terbitkan (pre-release bila versi memiliki -alpha/-beta/-rc)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          flag=""
          case "$TAG" in *-alpha.*|*-beta.*|*-rc.*) flag="--prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dl/* --clobber
          else
            # --target makes GitHub create the tag on this exact commit when it does not exist (manual run).
            gh release create "$TAG" dl/* $flag --title "Rekamind $TAG" --notes-file "docs/release-notes/${TAG}.md" --target "$GITHUB_SHA"
          fi

  # Prebuilt backend image on GHCR (ghcr.io/<owner>/rekamind-server) for Portainer / docker compose users.
  # Two variants: "<version>" = API only, "<version>-cpu" = also transcribes on the CPU. linux/amd64 only (beta).
  docker:
    needs: verify
    environment: release
    permissions: { contents: read, packages: write }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Tag names
        id: t
        run: |
          v="${TAG#v}"
          echo "v=$v" >> "$GITHUB_OUTPUT"
          echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rekamind-server" >> "$GITHUB_OUTPUT"
          case "$TAG" in *-alpha.*|*-beta.*|*-rc.*) echo "moving=beta" >> "$GITHUB_OUTPUT";; *) echo "moving=latest" >> "$GITHUB_OUTPUT";; esac
      - name: API-only image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          build-args: EXTRAS=postgres,s3
          push: true
          tags: |
            ${{ steps.t.outputs.repo }}:${{ steps.t.outputs.v }}
            ${{ steps.t.outputs.repo }}:${{ steps.t.outputs.moving }}
      - name: CPU image (transcribes)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          build-args: EXTRAS=postgres,s3,asr
          push: true
          tags: |
            ${{ steps.t.outputs.repo }}:${{ steps.t.outputs.v }}-cpu
            ${{ steps.t.outputs.repo }}:${{ steps.t.outputs.moving }}-cpu
      - name: NVIDIA GPU image (transcribes on CUDA 12)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          build-args: EXTRAS=postgres,s3,asr,cuda
          push: true
          tags: |
            ${{ steps.t.outputs.repo }}:${{ steps.t.outputs.v }}-cuda
            ${{ steps.t.outputs.repo }}:${{ steps.t.outputs.moving }}-cuda
