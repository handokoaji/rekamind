name: Build Windows installer

# WASAPI/ctranslate2/torch/openvino -- all native, not cross-compilable from
# Linux. GitHub's windows-latest runner is the pragmatic alternative.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # PyPI's default torch wheel has no CUDA compiled in, and pyproject.toml
      # can't express a per-package index URL -- so without this step the
      # installer silently ships GPU-less: detect_backend() still says "cuda"
      # (ctranslate2 has its own CUDA runtime), but pyannote can't follow it.
      # Installing torch FIRST means `pip install -e .` sees the requirement
      # already satisfied and leaves this build in place. Version pinned to
      # the one the working local build was validated against.
      - name: Install CUDA-enabled torch
        run: pip install torch==2.13.0+cu126 --index-url https://download.pytorch.org/whl/cu126

      - name: Install app
        run: pip install -e .

      - name: Install build + test deps
        run: pip install pyinstaller pytest

      - name: Run tests
        run: pytest

      - name: Download static ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
          New-Item -ItemType Directory -Force -Path packaging\ffmpeg | Out-Null
          $exe = Get-ChildItem -Path ffmpeg_extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName packaging\ffmpeg\ffmpeg.exe

      - name: Build with PyInstaller
        working-directory: packaging
        run: pyinstaller Rekamind.spec

      - name: Bundle ffmpeg next to the built exe
        shell: pwsh
        run: Copy-Item -Recurse -Force packaging\ffmpeg packaging\dist\Rekamind\ffmpeg

      - name: Stamp installer version from the pushed tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          (Get-Content packaging\installer.iss) `
            -replace 'AppVersion=.*', "AppVersion=$version" `
            -replace 'OutputBaseFilename=.*', "OutputBaseFilename=rekamind-$version" |
            Set-Content packaging\installer.iss

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: rekamind-installer
          path: packaging\Output\rekamind-*.exe

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: packaging\Output\rekamind-*.exe
