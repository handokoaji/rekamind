[project]
name = "rekamind-server"
version = "0.0.1"
description = "Rekamind v2 backend: API, job queue, and processing pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "pyjwt[crypto]>=2.8",  # verifies Google ID tokens (RS256 only)
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "numpy>=1.26",
    "python-docx>=1.1",  # Word export
    "tzdata",  # zone database for Windows and the frozen backend (they have no system copy)
    "av>=12,<17",  # (faster-whisper 1.2 breaks on av 17+) decodes mp3/m4a/ogg uploads to WAV; also a faster-whisper dependency
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
s3 = ["boto3>=1.34"]
asr = ["faster-whisper>=1.0", "soundfile>=0.12"]
diarize = ["pyannote.audio>=4.0", "soundfile>=0.12", "numpy"]
dev = ["python-multipart>=0.0.9", "pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "boto3>=1.34", "moto[server]>=5"]

[tool.setuptools.packages.find]
include = ["rekamind_server*"]

[tool.setuptools.package-data]
rekamind_server = ["migrations/script.py.mako"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S104", "S105", "S106", "S107"]  # throwaway credentials and bind addresses used as test inputs
