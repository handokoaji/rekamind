# Rekamind backend from the PREBUILT image: nothing to build, just paste and deploy.
# Portainer: Stacks -> Add stack -> Web editor -> paste this file -> fill the environment variables.
# Plain Docker:  docker compose -f docker-compose.image.yml up -d
#
# Image variants (same tag, different suffix):
#   ghcr.io/handokoaji/rekamind-server:0.4.0-beta.7-cpu   transcribes on the CPU (recommended; needs a few GB of RAM and
#                                                         downloads the Whisper model on first use into the data volume)
#   ghcr.io/handokoaji/rekamind-server:0.4.0-beta.7       API only: record, upload, view, export. Does NOT process meetings.
# NVIDIA/AMD/Intel GPU acceleration is not available in the image (beta); it runs on the CPU.
#
# AUTH: Google sign-in with YOUR OWN OAuth client (docs/AUTH.md). The server refuses to start without
# REKAMIND_PUBLIC_URL / REKAMIND_GOOGLE_CLIENT_ID / REKAMIND_GOOGLE_CLIENT_SECRET / REKAMIND_SUPERADMINS.
# The port is published on all interfaces (REKAMIND_BIND=0.0.0.0) so an HTTPS reverse proxy on another host can reach it: allow it only from that proxy in the firewall. Set REKAMIND_BIND=127.0.0.1 when the proxy runs on this host.
services:
  rekamind:
    image: ghcr.io/handokoaji/rekamind-server:${REKAMIND_IMAGE_TAG:-0.4.0-beta.8-cpu}
    restart: unless-stopped
    ports:
      - "${REKAMIND_BIND:-0.0.0.0}:${REKAMIND_PORT:-8787}:8787"
    environment:
      REKAMIND_AUTH: google
      REKAMIND_PUBLIC_URL: ${REKAMIND_PUBLIC_URL:?set REKAMIND_PUBLIC_URL, e.g. https://rekamind.example.com}
      REKAMIND_GOOGLE_CLIENT_ID: ${REKAMIND_GOOGLE_CLIENT_ID:?create a Google OAuth client, see docs/AUTH.md}
      REKAMIND_GOOGLE_CLIENT_SECRET: ${REKAMIND_GOOGLE_CLIENT_SECRET:?create a Google OAuth client, see docs/AUTH.md}
      REKAMIND_SUPERADMINS: ${REKAMIND_SUPERADMINS:?set at least one super admin email}
      REKAMIND_SIGNUP: ${REKAMIND_SIGNUP:-allowlist}
      REKAMIND_ALLOWED_EMAILS: ${REKAMIND_ALLOWED_EMAILS:-}
      REKAMIND_ALLOWED_DOMAINS: ${REKAMIND_ALLOWED_DOMAINS:-}
      REKAMIND_TIMEZONE: ${REKAMIND_TIMEZONE:-Asia/Jakarta}
      # Origins the desktop app (server mode) calls the API from. Leave the default if you use it; add your own if you serve another web page.
      REKAMIND_CORS_ORIGINS: ${REKAMIND_CORS_ORIGINS:-http://tauri.localhost,https://tauri.localhost,tauri://localhost}
      # >= 32 random characters; needed to store GitHub/GitLab/webhook tokens.
      REKAMIND_SECRET_KEY: ${REKAMIND_SECRET_KEY:-}
      # Processing (only in the -cpu image). "none" for the API-only image.
      REKAMIND_ENGINES: ${REKAMIND_ENGINES:-local}
      REKAMIND_WHISPER_DEVICE: cpu
      REKAMIND_WHISPER_MODEL: ${REKAMIND_WHISPER_MODEL:-small}   # large-v3 is more accurate but very slow on a CPU
      REKAMIND_LLM_API_KEY: ${REKAMIND_LLM_API_KEY:-}            # summary service key (e.g. Groq); without it no summary
      REKAMIND_LLM_BASE_URL: ${REKAMIND_LLM_BASE_URL:-https://api.groq.com/openai/v1}
      REKAMIND_LLM_MODEL: ${REKAMIND_LLM_MODEL:-openai/gpt-oss-120b}
      # Empty = SQLite inside the volume. Shared server: postgresql+asyncpg://user:pass@host:5432/rekamind
      REKAMIND_DATABASE_URL: ${REKAMIND_DATABASE_URL:-}
      REKAMIND_STORAGE: ${REKAMIND_STORAGE:-local}
      REKAMIND_S3_ENDPOINT_URL: ${REKAMIND_S3_ENDPOINT_URL:-}
      REKAMIND_S3_BUCKET: ${REKAMIND_S3_BUCKET:-rekamind}
      REKAMIND_S3_ACCESS_KEY: ${REKAMIND_S3_ACCESS_KEY:-}
      REKAMIND_S3_SECRET_KEY: ${REKAMIND_S3_SECRET_KEY:-}
      # Speaker separation: needs the "-cuda-diarize" image, REKAMIND_DIARIZER=pyannote and a Hugging Face token that accepted the pyannote model terms.
      REKAMIND_DIARIZER: ${REKAMIND_DIARIZER:-none}
      REKAMIND_HF_TOKEN: ${REKAMIND_HF_TOKEN:-}
      REKAMIND_WHISPER_COMPUTE_TYPE: ${REKAMIND_WHISPER_COMPUTE_TYPE:-auto}
      REKAMIND_GLOSSARY: ${REKAMIND_GLOSSARY:-}                  # names and jargon for Whisper, comma separated
      REKAMIND_MAX_UPLOAD_MB: ${REKAMIND_MAX_UPLOAD_MB:-4096}
      REKAMIND_LLM_CHUNK_CHARS: ${REKAMIND_LLM_CHUNK_CHARS:-12000}  # lower it if the summary service answers 429 (per-minute token cap)
      # Keep model downloads on plain HTTP: the slow-download guard below only watches those (Xet downloads bypass it).
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      REKAMIND_HF_MIN_MBPS: ${REKAMIND_HF_MIN_MBPS:-0.5}   # a model download slower than this (over 10 s) is dropped and retried on a new connection; 0 = off
    volumes:
      - rekamind-data:/data

volumes:
  rekamind-data:
