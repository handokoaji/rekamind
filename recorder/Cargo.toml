[package]
name = "rekamind-recorder"
version = "0.4.0-beta.7"
edition = "2021"
description = "Lightweight meeting audio recorder: mic + system audio to 16 kHz mono WAV, nothing else"
license = "AGPL-3.0-or-later"
authors = ["Rochmad Handoko Aji"]
homepage = "https://github.com/handokoaji/rekamind"
repository = "https://github.com/handokoaji/rekamind"

[lib]
name = "rekamind_recorder"
path = "src/lib.rs"

[[bin]]
name = "rekamind-rec"
path = "src/main.rs"

[dependencies]
ureq = { version = "3", default-features = false, features = ["json"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
lexopt = "0.3"
ctrlc = "3"
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
webbrowser = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[target.'cfg(windows)'.dependencies]
# Windows TLS via SChannel: no C toolchain, smaller binary, honours the OS certificate store.
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }
wasapi = "0.22"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[dev-dependencies]
tempfile = "3"

# Size and wake-ups are the product here: a recorder that is heavy defeats its purpose.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.test]
opt-level = 2

# Newer clippy suggests `as_chunks` (needs a recent rustc); `chunks_exact` is clear and works on older toolchains.
# Set here (not in lib.rs) so the integration tests under tests/ are covered too.
[lints.rust]
unknown_lints = "allow"

[lints.clippy]
chunks_exact_to_as_chunks = "allow"
