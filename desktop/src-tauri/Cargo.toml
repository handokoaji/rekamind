[package]
name = "rekamind-desktop"
version = "0.4.0-beta.6"
edition = "2021"
description = "Rekamind desktop shell: tray, hotkey and window around the lightweight recorder"
license = "AGPL-3.0-or-later"

[lib]
name = "rekamind_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "rekamind"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Enabled by `tauri build` (release). Without it the app loads devUrl instead of the embedded UI.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# SIGTERM/SIGHUP (logout, `kill`) must close the WAV files properly, not just Ctrl+C.
ctrlc = { version = "3", features = ["termination"] }
rekamind-recorder = { path = "../../recorder" }
webbrowser = "1"

# The login token is as sensitive as a password: it lives in the OS credential store, never a file.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
