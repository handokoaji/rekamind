[project]
name = "rekamind"
version = "0.1.0"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pyaudiowpatch",
    "faster-whisper>=1.0",
    "optimum[openvino]>=1.17",
    "soundfile>=0.12",
    "pyannote.audio>=4.0",
    "groq",
    "python-docx",
    "pystray>=0.19",
    "pillow>=10.0",
    "silero-vad",
    "tzdata",
    "minio",
]

[tool.setuptools.packages.find]
# Without this, setuptools' flat-layout auto-discovery also sees packaging/
# (the PyInstaller/Inno Setup build assets, not a Python package) as a
# second top-level package and refuses to guess, failing "pip install -e ."
# outright -- harmless locally where the editable install already existed,
# but fatal on a clean checkout (e.g. CI).
include = ["app*"]
