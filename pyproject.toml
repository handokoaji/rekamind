[project]
name = "meeting-recorder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pyaudiowpatch",
    "faster-whisper>=1.0",
    "optimum[openvino]>=1.17",
    "soundfile>=0.12",
    "pyannote.audio>=4.0",
    "groq",
    "python-docx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
